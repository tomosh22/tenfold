name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLANGD_VERSION: "22.1.1"
  CLANG_FORMAT_VERSION: "18.1.8"
  NINJA_VERSION: "1.13.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows jobs cannot build until A1 lands (POSIX-only Process.cpp, GCC-style warning flags).
    # TODO(A1): remove once Windows Process lands
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-24.04
            preset: release
            cc: gcc
            cxx: g++
            experimental: false
          - name: linux-clang-release
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
            experimental: false
          # Debug + -fsanitize=address,undefined (see the "asan" preset in CMakePresets.json).
          - name: linux-clang-asan-ubsan
            os: ubuntu-24.04
            preset: asan
            experimental: false
          - name: windows-msvc
            os: windows-2022
            preset: msvc
            msvc_env: true
            experimental: true # TODO(A1): remove once Windows Process lands
          - name: windows-clang-cl
            os: windows-2022
            preset: clang-cl
            msvc_env: true
            experimental: true # TODO(A1): remove once Windows Process lands
          - name: macos-appleclang
            os: macos-14
            preset: release
            cc: clang
            cxx: clang++
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clangd and Ninja (pip)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clangd==${CLANGD_VERSION}" "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: MSVC developer environment
        if: matrix.msvc_env
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Toolchain versions
        shell: bash
        run: |
          command -v clangd ninja cmake
          clangd --version
          ninja --version
          cmake --version

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}" --parallel -- -k 0  # report every failing TU

      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.preset }}" --timeout 300

  format:
    name: clang-format (changed files)
    runs-on: ubuntu-24.04
    # Advisory until the house style and .clang-format are reconciled (docs/OPEN_QUESTIONS.md #14).
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: |
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
          clang-format --version

      - name: Check changed C++ files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Merge base of the PR target and the PR head.
            base="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$PR_BASE_SHA")"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            # First push, new branch, or a force-push that dropped the old tip:
            # use the merge base with the default branch, else the head's parent,
            # else (root commit) the empty tree.
            if git rev-parse --verify -q "origin/$DEFAULT_BRANCH" >/dev/null \
               && b="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null)" \
               && [ "$b" != "$HEAD_SHA" ]; then
              base="$b"
            elif git rev-parse --verify -q "$HEAD_SHA^" >/dev/null; then
              base="$(git rev-parse "$HEAD_SHA^")"
            else
              base="$(git hash-object -t tree /dev/null)"
            fi
          fi
          echo "Diff base: $base"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" "$HEAD_SHA" -- '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' '*.hxx' ':!third_party')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ files changed."
            exit 0
          fi
          printf 'Checking changed lines in %s\n' "${files[@]}"
          # Only lines changed since the base are checked: existing code is hand-formatted
          # and is not expected to match .clang-format byte for byte.
          out="$(git clang-format --binary "$(command -v clang-format)" --diff "$base" "$HEAD_SHA" -- "${files[@]}" || true)"
          if printf '%s\n' "$out" | grep -q '^@@'; then
            printf '%s\n' "$out"
            echo "::error::Changed lines are not clang-formatted. Run: git clang-format $base"
            exit 1
          fi
          echo "Changed lines are clang-formatted."

  ui-linux:
    name: linux-ui-xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja (pip)
        run: |
          python -m pip install "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: Install X11, GL and Xvfb packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libglx-mesa0 libegl1 \
            libgl-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libxrender-dev libfreetype-dev fonts-dejavu-core fonts-wqy-zenhei

      - name: Configure
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DTENFOLD_BUILD_UI=ON

      - name: Build
        run: cmake --build build-ui --parallel

      - name: Engine tests
        run: ./build-ui/tenfold-tests

      - name: Text tests (FreeType, atlas, layout; no display)
        run: ./build-ui/tenfold-text-tests

      - name: UI tests (Xvfb + Mesa llvmpipe)
        run: xvfb-run -a ./build-ui/tenfold-ui-tests

      - name: Headless screenshot
        run: |
          xvfb-run -a ./build-ui/tenfold-ui --screenshot b1.png
          python tests/ui/check_png.py b1.png 1024 640
