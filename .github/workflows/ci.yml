name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLANGD_VERSION: "22.1.1"
  CLANG_FORMAT_VERSION: "18.1.8"
  NINJA_VERSION: "1.13.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows jobs cannot build until A1 lands (POSIX-only Process.cpp, GCC-style warning flags).
    # TODO(A1): remove once Windows Process lands
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-24.04
            preset: release
            cc: gcc
            cxx: g++
            experimental: false
          - name: linux-clang-release
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
            experimental: false
          # Debug + -fsanitize=address,undefined (see the "asan" preset in CMakePresets.json).
          - name: linux-clang-asan-ubsan
            os: ubuntu-24.04
            preset: asan
            experimental: false
          - name: windows-msvc
            os: windows-2022
            preset: msvc
            msvc_env: true
            experimental: false
          - name: windows-clang-cl
            os: windows-2022
            preset: clang-cl
            msvc_env: true
            experimental: false
          - name: macos-appleclang
            os: macos-14
            preset: release
            cc: clang
            cxx: clang++
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clangd and Ninja (pip)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clangd==${CLANGD_VERSION}" "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: MSVC developer environment
        if: matrix.msvc_env
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Toolchain versions
        shell: bash
        run: |
          command -v clangd ninja cmake
          clangd --version
          ninja --version
          cmake --version

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}" --parallel -- -k 0  # report every failing TU

      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.preset }}" --timeout 300

  # ThreadSanitizer on the engine suite only (the UI tests stay out: Mesa / SDL are noisy under TSan).
  # tsan.supp lists third-party false positives, each justified; races in our own code are fixed, not suppressed.
  linux-gcc-tsan:
    name: linux-gcc-tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clangd and Ninja (pip)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clangd==${CLANGD_VERSION}" "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: cmake --preset tsan

      - name: Build
        run: cmake --build --preset tsan --parallel --target tenfold-tests

      - name: Engine tests under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tsan.supp
        run: ./build/tsan/tenfold-tests

  format:
    name: clang-format (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: |
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
          clang-format --version

      - name: Check changed C++ files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Merge base of the PR target and the PR head.
            base="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$PR_BASE_SHA")"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            # First push, new branch, or a force-push that dropped the old tip:
            # use the merge base with the default branch, else the head's parent,
            # else (root commit) the empty tree.
            if git rev-parse --verify -q "origin/$DEFAULT_BRANCH" >/dev/null \
               && b="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null)" \
               && [ "$b" != "$HEAD_SHA" ]; then
              base="$b"
            elif git rev-parse --verify -q "$HEAD_SHA^" >/dev/null; then
              base="$(git rev-parse "$HEAD_SHA^")"
            else
              base="$(git hash-object -t tree /dev/null)"
            fi
          fi
          echo "Diff base: $base"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" "$HEAD_SHA" -- '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' '*.hxx' ':!third_party')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ files changed."
            exit 0
          fi
          printf 'Checking changed lines in %s\n' "${files[@]}"
          # Only lines changed since the base are checked: existing code is hand-formatted
          # and is not expected to match .clang-format byte for byte.
          out="$(git clang-format --binary "$(command -v clang-format)" --diff "$base" "$HEAD_SHA" -- "${files[@]}" || true)"
          if printf '%s\n' "$out" | grep -q '^@@'; then
            printf '%s\n' "$out"
            echo "::error::Changed lines are not clang-formatted. Run: git clang-format $base"
            exit 1
          fi
          echo "Changed lines are clang-formatted."

  ui-linux:
    name: linux-ui-xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja (pip)
        run: |
          python -m pip install "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: Install X11, GL and Xvfb packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libglx-mesa0 libegl1 \
            libgl-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libxrender-dev libfreetype-dev fonts-dejavu-core fonts-wqy-zenhei

      - name: Configure
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DTENFOLD_BUILD_UI=ON

      - name: Build
        run: cmake --build build-ui --parallel

      - name: Engine tests
        run: ./build-ui/tenfold-tests

      - name: Text tests (FreeType, atlas, layout; no display)
        run: ./build-ui/tenfold-text-tests

      - name: UI tests (Xvfb + Mesa llvmpipe)
        run: xvfb-run -a ./build-ui/tenfold-ui-tests

      - name: Headless screenshot
        run: |
          xvfb-run -a ./build-ui/tenfold-ui --screenshot b1.png
          python tests/ui/check_png.py b1.png 1024 640

  # B9: native Windows build of the SDL3 UI with the Direct3D 11 backend, tested on WARP (the runner has no GPU).
  windows-ui:
    name: windows-ui-d3d11
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja (pip)
        shell: bash
        run: |
          python -m pip install "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure (SDL3 + FreeType via FetchContent, D3D11 backend)
        shell: bash
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DTENFOLD_BUILD_UI=ON -DTENFOLD_D3D11=ON

      - name: Build
        shell: bash
        run: cmake --build build-ui --parallel -- -k 0

      # Runs every UI test: the backend-agnostic ones, plus the *_d3d11 renderer tests on WARP (forced by the
      # fixture). GL-only tests skip themselves when the runner has no OpenGL 3.3 context.
      - name: UI tests (D3D11 on WARP)
        shell: bash
        run: ./build-ui/tenfold-ui-tests.exe

      - name: D3D11 renderer tests only
        shell: bash
        run: ./build-ui/tenfold-ui-tests.exe d3d11

      - name: Headless screenshot (D3D11)
        shell: bash
        env:
          TENFOLD_D3D11_WARP: "1"
        run: |
          ./build-ui/tenfold-ui.exe --renderer=d3d11 --demo --screenshot b9_demo.png
          python tests/ui/check_png.py b9_demo.png 1024 640
          ./build-ui/tenfold-ui.exe --renderer=d3d11 --screenshot b9_editor.png || echo "editor screenshot failed (font discovery on the runner?)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-screenshots
          path: |
            b9_*.png
            *.actual.png
          if-no-files-found: ignore

  # C2b: drives a real Visual Studio 2022 (preinstalled on windows-2022) through EnvDTE: the only place the backend
  # meets a real devenv.exe. Only the vsdte tests run; vsdte_integration needs the env var.
  windows-vs-debugger:
    name: windows-vs-debugger
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja (pip)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake --preset msvc

      - name: Build tenfold-tests
        shell: bash
        run: cmake --build --preset msvc --parallel --target tenfold-tests

      - name: Visual Studio installation
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion

      - name: Helper tests and Visual Studio integration test
        shell: bash
        env:
          TENFOLD_VS_DTE_TEST: "1"
        run: ./build/msvc/tenfold-tests.exe vsdte

      - name: Visual Studio ActivityLog tails (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\VisualStudio" -Directory -Filter "17.0_*" -ErrorAction SilentlyContinue | ForEach-Object {
            $log = Join-Path $_.FullName "ActivityLog.xml"
            Write-Host "=== $log"
            if (Test-Path $log) { Get-Content $log -Tail 150 } else { Write-Host "(no ActivityLog.xml)" }
          }
          Get-Process devenv, ServiceHub* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime

  # D1: distributable packages. Only on pushes to main and v* tags (a package is ~100 MB because of clangd), and
  # non-blocking until it has run green once. Each job builds Release with the UI, downloads the pinned clangd
  # (tools/package/ClangdPin.cmake, SHA-256 verified), runs cpack and smoke-tests the unpacked package with every other
  # clangd removed from PATH (tools/package/smoke-test.sh requires the engine to log that it chose the bundled one).
  package:
    name: package-${{ matrix.name }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true  # TODO: drop once the package jobs have run green once
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            msvc_env: true
            cpack: ZIP
          - name: linux-x64
            os: ubuntu-24.04
            cpack: TGZ
          - name: macos-arm64  # best effort
            os: macos-14
            cpack: TGZ;DragNDrop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja (pip)
        shell: bash
        run: |
          python -m pip install "ninja==${NINJA_VERSION}"
          python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"

      - name: Install X11, GL and FreeType dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxfixes-dev libxss-dev libxkbcommon-dev libxrender-dev libfreetype-dev

      - name: MSVC developer environment
        if: matrix.msvc_env
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake -S . -B build-pkg -G Ninja -DCMAKE_BUILD_TYPE=Release -DTENFOLD_BUILD_UI=ON

      - name: Build
        shell: bash
        run: cmake --build build-pkg --parallel

      - name: Fetch pinned clangd (SHA-256 verified)
        shell: bash
        run: cmake --build build-pkg --target fetch-clangd

      - name: Package
        shell: bash
        working-directory: build-pkg
        run: cpack -G "${{ matrix.cpack }}"

      - name: Smoke test (bundled clangd, no other clangd on PATH)
        shell: bash
        run: |
          pkg="$(ls build-pkg/tenfold-*.zip build-pkg/tenfold-*.tar.gz 2>/dev/null | head -n1 || true)"  # one pattern never matches
          echo "package: $pkg"
          tools/package/smoke-test.sh "$pkg" "$PWD"

      - name: AppImage (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: tools/package/appimage.sh build-pkg build-pkg/appimage

      - uses: actions/upload-artifact@v4
        with:
          name: tenfold-${{ matrix.name }}
          path: |
            build-pkg/tenfold-*.zip
            build-pkg/tenfold-*.tar.gz
            build-pkg/tenfold-*.dmg
            build-pkg/appimage/*.AppImage
          if-no-files-found: error
